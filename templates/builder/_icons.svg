{% comment %}
Inline SVG sprite. Inlined rather than linked so <use href="#id"> resolves
without a second request and inherits currentColor for theming.
All symbols use a 24x24 grid, stroke-based, so they scale cleanly.
{% endcomment %}
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"
     style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <g id="s" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="icon-chart" viewBox="0 0 24 24">
    <rect x="3" y="13" width="4" height="8" rx="1" fill="currentColor"/>
    <rect x="10" y="8" width="4" height="13" rx="1" fill="currentColor"/>
    <rect x="17" y="3" width="4" height="18" rx="1" fill="currentColor" opacity=".65"/>
  </symbol>

  <symbol id="icon-upload" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M12 15V3"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/>
      <path d="M3 15v3.5A2.5 2.5 0 0 0 5.5 21h13a2.5 2.5 0 0 0 2.5-2.5V15"/>
    </g>
  </symbol>

  <symbol id="icon-download" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/>
      <path d="M3 16v2.5A2.5 2.5 0 0 0 5.5 21h13a2.5 2.5 0 0 0 2.5-2.5V16"/>
    </g>
  </symbol>

  <symbol id="icon-archive" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="4.5" rx="1"/>
      <path d="M4.5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V8.5"/>
      <path d="M10 12.5h4"/>
    </g>
  </symbol>

  <symbol id="icon-pdf" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M14 3H7a1.8 1.8 0 0 0-1.8 1.8v14.4A1.8 1.8 0 0 0 7 21h10a1.8 1.8 0 0 0 1.8-1.8V8z"/>
      <path d="M14 3v5h4.8"/><path d="M8.6 16.5h6.8"/><path d="M8.6 13h4.4"/>
    </g>
  </symbol>

  <symbol id="icon-csv" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="15" rx="1.8"/>
      <path d="M3 9.5h18"/><path d="M9.5 9.5v10"/><path d="M3 14.5h18"/>
    </g>
  </symbol>

  <symbol id="icon-sheet" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="15" rx="1.8"/>
      <path d="M3 9.5h18"/><path d="M14 9.5v10"/>
      <path d="M6.5 13h4"/><path d="M6.5 16.2h4"/>
    </g>
  </symbol>

  <symbol id="icon-file" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M14 3H7a1.8 1.8 0 0 0-1.8 1.8v14.4A1.8 1.8 0 0 0 7 21h10a1.8 1.8 0 0 0 1.8-1.8V8z"/>
      <path d="M14 3v5h4.8"/>
    </g>
  </symbol>

  <symbol id="icon-check" viewBox="0 0 24 24">
    <path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-warn" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 7.5v6"/><path d="M12 17h.01"/>
    </g>
  </symbol>

  <symbol id="icon-cross" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/>
    </g>
  </symbol>

  <symbol id="icon-moon" viewBox="0 0 24 24">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"
          fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="icon-sun" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>
    </g>
  </symbol>

  <symbol id="icon-arrow-right" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M4 12h15"/><path d="m13 6 6 6-6 6"/>
    </g>
  </symbol>

  <symbol id="icon-shield" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M12 3l7 3v5.5c0 4.2-2.9 8-7 9.5-4.1-1.5-7-5.3-7-9.5V6z"/>
      <path d="m9 12 2 2 4-4"/>
    </g>
  </symbol>
</svg>
